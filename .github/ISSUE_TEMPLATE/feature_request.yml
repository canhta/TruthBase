name: Feature or design change
description: Propose one concrete outcome.
title: "[Proposal]: "
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected user
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance
      description: Give one observable example and relevant boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or tradeoffs
